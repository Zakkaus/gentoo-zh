name: pkgcheck-comment
on:
  workflow_run:
    workflows: [pkgcheck]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: Check for the report
      id: report
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.event.workflow_run.id }}
      run: |
        artifacts=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate --slurp)
        available=$(jq 'any(.[] | .artifacts[]; .name == "pkgcheck-report")' <<< "$artifacts")
        echo "available=$available" >> "$GITHUB_OUTPUT"

    - name: Download the report
      if: steps.report.outputs.available == 'true'
      uses: actions/download-artifact@v8
      with:
        name: pkgcheck-report
        path: pkgcheck-report
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Post the report
      if: steps.report.outputs.available == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        RUN_URL: ${{ github.event.workflow_run.html_url }}
      run: scripts/pkgcheck-comment.sh pkgcheck-report

    - name: Close a pull request with malformed commits
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        pulls=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate --slurp)
        pr=$(jq -r --arg sha "$HEAD_SHA" 'first(.[][] | select(.head.sha == $sha) | .number) // empty' <<< "$pulls")
        [ -n "$pr" ] || exit 0
        bad=$(gh api "repos/$REPO/pulls/$pr/commits?per_page=100" --paginate --jq '
          .[] | (.commit.message | split("\n")[0]) as $s
          | if (.parents | length) > 1 then ["It is a merge commit"]
            else [ if ($s | test("^(Revert \"|[^\\s:][^:]*: \\S)")) then empty else "The subject does not start with what it changes" end,
                   if (.commit.message | test("(?m)^Signed-off-by: \\S")) then empty else "It has no `Signed-off-by:` line" end ]
            end as $why
          | select($why | length > 0)
          | "- `\(.sha[0:12])` \($s)\n" + ($why | map("  - " + .) | join("\n"))')
        [ -n "$bad" ] || exit 0
        cat > body.md <<EOF
        This pull request was closed automatically because these commits break the commit rules:

        $bad

        ### Commit rules

        1. **Subject**: start with the package or file the commit changes, a colon and a short summary.
           \`\`\`
           app-misc/foo: add 1.2.3, drop 1.2.2
           app-misc/foo: fix the build with GCC 16
           profiles: mask app-misc/foo
           foo.eclass: support EAPI 9
           \`\`\`
        2. **Sign-off**: every commit ends with a \`Signed-off-by\` line.
           \`\`\`
           Signed-off-by: Your Name <you@example.com>
           \`\`\`
           \`git commit -s\` and \`pkgdev commit --signoff\` add it for you.
        3. **No merge commits**: update the branch with \`git rebase\`, not \`git merge\` or the Update branch button.

        ### How to fix

        \`\`\`
        git fetch https://github.com/gentoo-zh/overlay.git master
        git rebase -i FETCH_HEAD          # mark a commit "reword" to fix its subject
        git rebase --signoff FETCH_HEAD   # add Signed-off-by to every commit
        git push --force-with-lease
        \`\`\`

        A closed pull request cannot be reopened after a force push, so open a new one. See [CONTRIBUTING.en.md](https://github.com/gentoo-zh/overlay/blob/master/CONTRIBUTING.en.md).
        EOF
        gh pr close "$pr" -R "$REPO" --comment "$(cat body.md)"
