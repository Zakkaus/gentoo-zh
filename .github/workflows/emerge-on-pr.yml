name: emerge-on-pr

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '.github/**'
      - 'metadata/**'
      - 'profiles/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: select emerge targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      targets: ${{ steps.packages.outputs.targets }}
      image: ${{ steps.image.outputs.ref }}

    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: scan changed ebuilds
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
      id: packages
      run: |
        targets=$(scripts/emerge-targets.sh "$PR")
        echo "targets=$targets" >> "$GITHUB_OUTPUT"

    - name: set image name
      id: image
      run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stage3" >> "$GITHUB_OUTPUT"

  build:
    name: emerge ${{ matrix.target.package }} (${{ matrix.target.profile }})
    needs: scan
    if: fromJSON(needs.scan.outputs.targets)[0] != null
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.scan.outputs.targets) }}

    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.scan.outputs.image }}:${{ matrix.target.profile }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged

    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}

    - name: setup portage config
      uses: ./.github/actions/setup-gentoo

    - name: setup cpu flags
      env:
        ATOM: ${{ matrix.target.package }}
      run: |
        if scripts/needs-cpu-flags.sh "$ATOM"; then
          FEATURES="getbinpkg" emerge --oneshot --quiet app-portage/cpuid2cpuflags
          echo "$ATOM $(cpuid2cpuflags)" > /etc/portage/package.use/cpu-flags
          cat /etc/portage/package.use/cpu-flags
        fi

    - name: emerge --onlydeps packages
      id: deps
      shell: bash
      env:
        ATOM: ${{ matrix.target.package }}
      run: |
        FEATURES="getbinpkg" emerge --onlydeps --jobs 2 --quiet --verbose --autounmask=y --autounmask-write=y --autounmask-continue=y "$ATOM" 2>&1 | tee /var/tmp/deps.log
        rm -rf /var/log/portage/elog/*

    - name: emerge packages
      id: emerge
      shell: bash
      env:
        ATOM: ${{ matrix.target.package }}
      run: emerge --verbose --autounmask=y --autounmask-write=y --autounmask-continue=y "$ATOM" 2>&1 | tee /var/tmp/emerge.log

    - name: save portage elog
      if: ${{ !cancelled() }}
      env:
        ATOM: ${{ matrix.target.package }}
        PROFILE: ${{ matrix.target.profile }}
        DEPS: ${{ steps.deps.outcome }}
        OUTCOME: ${{ steps.emerge.outcome }}
      run: |
        mkdir -p elog-report
        echo "$ATOM" > elog-report/atom
        echo "$PROFILE" > elog-report/profile
        echo "$DEPS" > elog-report/deps
        echo "$OUTCOME" > elog-report/outcome
        [ "$DEPS" != failure ] || tail -n 40 /var/tmp/deps.log > elog-report/output
        [ "$OUTCOME" != failure ] || tail -n 40 /var/tmp/emerge.log > elog-report/output
        # the onlydeps elog is left over when that step fails
        [ "$OUTCOME" != skipped ] || exit 0
        for file in /var/log/portage/elog/*; do
          [ -f "$file" ] || continue
          # category:pf:date.log -> category/pf
          pkg=${file##*/}
          pkg=${pkg%:*}
          echo ">>> ${pkg/://}"
          cat "$file"
        done > elog-report/elog

    - name: upload portage elog
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: elog-${{ strategy.job-index }}
        path: elog-report/

    # warn elog, such as CONFIG_CHECK without kernel sources, only goes to the PR comment
    - name: check portage elog
      run: |
        cat elog-report/elog
        if grep -qE '^(QA|ERROR): [a-z]+$' elog-report/elog; then
          echo "Found QA or error elog messages."
          exit 1
        fi
        echo "No QA or error elog messages found."
